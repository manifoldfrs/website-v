name: Post to X

on:
  push:
    branches: [master]
    paths:
      - "src/content/posts/*.md"
  workflow_dispatch:
    inputs:
      post:
        description: "Post filename to share, e.g. independence.md"
        required: true
        type: string

concurrency:
  group: post-to-x
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only added files count as new posts, so edits to published posts never re-post.
      - name: Find new posts
        id: new-posts
        env:
          POST: ${{ inputs.post }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$POST" =~ ^[a-z0-9-]+\.md$ ]] || [ ! -f "src/content/posts/$POST" ]; then
              echo "::error::No post named '$POST' in src/content/posts"
              exit 1
            fi
            echo "files=src/content/posts/$POST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --diff-filter=A --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "src/content/posts/*.md" | tr "\n" " ")
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "New posts: ${files:-none}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.new-posts.outputs.files != ''
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.new-posts.outputs.files != ''

      - run: pnpm install --frozen-lockfile
        if: steps.new-posts.outputs.files != ''

      - name: Post to X
        if: steps.new-posts.outputs.files != ''
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FILES: ${{ steps.new-posts.outputs.files }}
        # FILES is intentionally unquoted so each path becomes its own argument; post slugs have no spaces.
        run: node scripts/post-to-x.ts $FILES
